<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Rotação torácica em quatro apoios: mão na nuca, cotovelo desce e depois abre para o teto -->
  <rect width="400" height="300" fill="#ffffff"/>
  <rect x="20" y="252" width="360" height="8" rx="4" fill="#e2e8f0"/>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- pernas ajoelhadas -->
    <path d="M150 172 L150 250 L95 250" stroke="#94a3b8" stroke-width="16"/>
    <path d="M150 172 L150 250 L95 250" stroke="#334155" stroke-width="16" opacity="0.85"/>
    <!-- braço de apoio -->
    <path d="M270 172 L270 250" stroke="#334155" stroke-width="14"/>
    <!-- tronco -->
    <path d="M150 172 L270 172" stroke="#334155" stroke-width="26"/>
    <!-- cabeça e rabo de cavalo -->
    <circle cx="302" cy="160" r="19" fill="#334155" stroke="none"/>
    <path d="M286 150 C272 146 268 160 276 170" stroke="#334155" stroke-width="7"/>
    <!-- seta mostrando a rotação para o teto -->
    <path d="M222 120 A55 55 0 0 1 300 95" stroke="#22c55e" stroke-width="4" stroke-dasharray="6 7" opacity="0.7">
      <animate attributeName="opacity" values="0;0.8;0.8;0;0" keyTimes="0;0.25;0.55;0.8;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M292 86 L302 95 L289 101" stroke="#22c55e" stroke-width="4" opacity="0.7">
      <animate attributeName="opacity" values="0;0.8;0.8;0;0" keyTimes="0;0.25;0.55;0.8;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- braço com a mão na nuca: cotovelo embaixo, depois aberto para cima -->
    <path stroke="#22c55e" stroke-width="13" d="M270 172 L282 220 L300 168">
      <animate attributeName="d" values="M270 172 L282 220 L300 168; M270 172 L262 104 L300 152; M270 172 L262 104 L300 152; M270 172 L282 220 L300 168; M270 172 L282 220 L300 168" keyTimes="0; 0.35; 0.6; 0.95; 1" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
