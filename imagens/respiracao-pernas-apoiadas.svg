<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Respiração com pernas apoiadas: deitada, pés no banco com joelhos a 90°, a costela enche e esvazia -->
  <rect width="400" height="300" fill="#ffffff"/>
  <rect x="20" y="252" width="360" height="8" rx="4" fill="#e2e8f0"/>
  <!-- banco -->
  <rect x="262" y="150" width="86" height="102" rx="8" fill="#cbd5e1"/>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- tronco deitado -->
    <path d="M100 226 L215 226" stroke="#334155" stroke-width="26"/>
    <!-- coxas na vertical e canelas apoiadas no banco -->
    <path d="M215 226 L215 146 L300 146" stroke="#334155" stroke-width="16"/>
    <!-- braço ao lado do corpo -->
    <path d="M120 232 L190 240" stroke="#94a3b8" stroke-width="11"/>
    <!-- cabeça e rabo de cavalo -->
    <circle cx="74" cy="222" r="19" fill="#334155" stroke="none"/>
    <path d="M60 236 C52 246 64 252 74 246" stroke="#334155" stroke-width="7"/>
  </g>
  <!-- costela enchendo de ar -->
  <ellipse cx="150" cy="212" rx="34" ry="10" fill="#22c55e" opacity="0.55">
    <animate attributeName="ry" values="10;20;20;10;10" keyTimes="0;0.4;0.5;0.9;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="212;202;202;212;212" keyTimes="0;0.4;0.5;0.9;1" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <!-- setas de ar -->
  <g stroke="#22c55e" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M150 150 L150 178 M141 168 L150 178 L159 168">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.95;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M150 178 L150 150 M141 160 L150 150 L159 160" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.9;1" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#16a34a" text-anchor="middle">
    <text x="150" y="132">enche a costela
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="132" opacity="0">solta devagar
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
